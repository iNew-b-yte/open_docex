# Release (EXECUTION_PLAN V1-43; LLD Part 1 §1.10).
#
# Nothing here runs on a push to a branch. It runs only when
#   - a tag `vX.Y.Z` is pushed, which PUBLISHES the three packages to npm, or
#   - someone starts it by hand from the Actions tab, where `dry_run` defaults to true.
# Publishing is the project owner's decision (they own the @open-docex npm organisation). Before
# pushing a tag: CI must be green on the tagged commit, `node scripts/set-version.mjs X.Y.Z` must
# have been committed, and CHANGELOG.md must carry the version and date.
#
# Needs the repository secret NPM_TOKEN (an npm automation token for the @open-docex scope).
# `--provenance` signs the packages with this workflow's identity, which needs `id-token: write`.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only run `npm publish --dry-run` (nothing is uploaded)'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check:versions
      - run: npm run check:licenses
      - run: npm run audit:prod
      - run: npm run build
      - run: npm test

      - name: The tag must match the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p "require('./shared/package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match the package version v${version}" >&2
            exit 1
          fi

      # shared first: the server and the client depend on it at exactly this version.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          flag=""
          if [ "${DRY_RUN}" = "true" ]; then flag="--dry-run"; fi
          for workspace in shared backend frontend; do
            npm publish --workspace "${workspace}" --access public --provenance ${flag}
          done
