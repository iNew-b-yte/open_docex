# CI (LLD Part 1 §1.10). V1-40 adds the `e2e` job and V3-02 the `queues` job.
# The Node matrix drops a line at its end of life (CL-10).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npm run check:licenses
      - run: npm run audit:prod
      - run: npm run check:versions

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-draw libreoffice-calc fonts-liberation fonts-dejavu-core
      - run: npm ci
      - run: npm run build
      - run: npm test
        env:
          OPEN_DOCEX_LO_TESTS: '1'

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install LibreOffice
        run: choco install libreoffice-fresh -y --no-progress
      - run: npm ci
      - run: npm run build
      - run: npm test
        env:
          OPEN_DOCEX_LO_TESTS: '1'
